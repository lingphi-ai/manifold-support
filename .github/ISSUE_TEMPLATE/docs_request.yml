name: Documentation request
description: Request a missing or clearer Manifold doc.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English
        - 中文
        - Both
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page or topic
      placeholder: "quick-start, routes, provider setup, API reference"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing or unclear?
      description: Describe the user task the docs should help with.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording or example
      description: Optional, but examples make docs requests easier to merge.
